spring:
  application:
    name: intelligent-log-analyzer
  datasource:
    url: ${ILA_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/log_analysis}
    username: ${ILA_DATABASE_USERNAME:log_analysis}
    password: ${ILA_DATABASE_PASSWORD:log_analysis}
    hikari:
      maximum-pool-size: ${ILA_DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${ILA_MAX_IMPORT_SIZE:20MB}
      max-request-size: ${ILA_MAX_IMPORT_SIZE:20MB}

server:
  port: ${ILA_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: logstash

springdoc:
  swagger-ui:
    path: /swagger-ui.html

analysis:
  imports:
    storage-path: ${ILA_IMPORT_STORAGE_PATH:./data/imports}
    max-lines: ${ILA_MAX_IMPORT_LINES:100000}
    max-line-length: ${ILA_MAX_LINE_LENGTH:16384}
    batch-size: ${ILA_IMPORT_BATCH_SIZE:500}
  detection:
    repeated-error-threshold: ${ILA_REPEATED_ERROR_THRESHOLD:5}
    repeated-error-window: ${ILA_REPEATED_ERROR_WINDOW:PT5M}
    spike-minimum-count: ${ILA_SPIKE_MINIMUM_COUNT:10}
    spike-multiplier: ${ILA_SPIKE_MULTIPLIER:3.0}
    sequence-window: ${ILA_SEQUENCE_WINDOW:PT10M}
  summary:
    provider: ${ILA_SUMMARY_PROVIDER:disabled}
    base-url: ${ILA_SUMMARY_BASE_URL:http://127.0.0.1:11434/v1}
    model: ${ILA_SUMMARY_MODEL:qwen2.5:3b}
    api-token: ${ILA_SUMMARY_API_TOKEN:}
